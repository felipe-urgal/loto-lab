name: Security

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0

      - name: Audit production dependencies
        run: npm run audit:prod

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4, resolved 2026-08-26
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4, resolved 2026-08-26
        with:
          category: /language:javascript-typescript

  supply-chain:
    name: Container and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        timeout-minutes: 5
        run: docker build -t loto-lab:security .

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: loto-lab:security
          format: spdx-json
          output-file: loto-lab.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loto-lab-sbom
          path: loto-lab.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Report HIGH and CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: loto-lab:security
          version: v0.70.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0
          scanners: vuln
          timeout: 5m0s

      - name: Block fixable HIGH and CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: loto-lab:security
          version: v0.70.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          scanners: vuln
          timeout: 5m0s
