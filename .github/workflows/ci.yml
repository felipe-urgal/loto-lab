name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: loto_lab_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loto_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loto_lab_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Verify Node.js toolchain
        run: |
          test "$(node --version)" = "v24.19.0"
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run static quality gates
        run: npm run quality:static

      - name: Run tests
        run: npm test

      - name: Measure test coverage
        run: npm run coverage

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Validate production Compose
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config >/dev/null

      - name: Build production image
        run: docker build -t loto-lab:ci .

      - name: Smoke-test production image
        shell: bash
        run: |
          set -euo pipefail
          container=loto-lab-ci
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --name "$container" --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e API_HOST=127.0.0.1 \
            -e API_PORT=3099 \
            -e OPS_AUTO_SYNC=false \
            loto-lab:ci >/dev/null

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3099/health/ready >/dev/null; then
              curl -fsS http://127.0.0.1:3099/ >/dev/null
              exit 0
            fi
            sleep 1
          done

          docker logs "$container"
          exit 1

      - name: Smoke-test production authentication
        shell: bash
        run: |
          set -euo pipefail
          container=loto-lab-auth-ci
          password='ci-long-random-password-123'
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --name "$container" --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e API_HOST=127.0.0.1 \
            -e API_PORT=3099 \
            -e OPS_AUTO_SYNC=false \
            -e APP_AUTH_USER=loto-admin \
            -e APP_AUTH_PASSWORD="$password" \
            loto-lab:ci >/dev/null

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3099/health/ready >/dev/null; then
              code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3099/)
              test "$code" = 401
              curl -fsS -u "loto-admin:$password" http://127.0.0.1:3099/ >/dev/null
              exit 0
            fi
            sleep 1
          done

          docker logs "$container"
          exit 1

      - name: Run real-browser E2E
        shell: bash
        run: |
          set -euo pipefail
          container=loto-lab-browser-e2e
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --name "$container" --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e API_HOST=127.0.0.1 \
            -e API_PORT=3099 \
            -e OPS_AUTO_SYNC=false \
            loto-lab:ci >/dev/null

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3099/health/ready >/dev/null; then
              E2E_BASE_URL=http://127.0.0.1:3099 npm run e2e:browser
              exit 0
            fi
            sleep 1
          done

          docker logs "$container"
          exit 1
